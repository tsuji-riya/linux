%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/celestial,cnc1800l-vic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Celestial Semiconductor CNC1800L Vectored Interrupt Controller

description:
  Single-level, 32-line, level-triggered-only interrupt controller found on
  the Celestial Semiconductor CNC1800L SoC. It is always the root interrupt
  controller (there is no secondary/cascaded controller on this SoC) and is
  never chained onto another interrupt source.

maintainers:
  - Riya Tsuji <tsuji.riya@gmail.com>

allOf:
  - $ref: /schemas/interrupt-controller.yaml#

properties:
  compatible:
    const: celestial,cnc1800l-vic

  reg:
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    const: 1

required:
  - compatible
  - reg
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    interrupt-controller@80140000 {
        compatible = "celestial,cnc1800l-vic";
        reg = <0x80140000 0x100>;
        interrupt-controller;
        #interrupt-cells = <1>;
    };
...
